[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tipping-point"
version = "0.1.0"
description = "Sandbox-only workshop booking application"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/tipping_point"]